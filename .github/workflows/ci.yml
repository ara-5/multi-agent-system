name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train (tiny smoke test)
        run: python train.py --timesteps 4000 --num-vec-envs 2 --out models/ci_smoke_test

      - name: Evaluate
        run: python evaluate.py --model models/ci_smoke_test --episodes 1
